<!DOCTYPE html>
<html lang="en">
<head>
   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <title>FamousFace - Famous People Quiz | Trivia & Daily Challenges</title>

    <meta name="description"
          content="Test your knowledge with FamousFace famous people quizzes. Guess celebrities, musicians, actors, athletes and other famous personalities.">

    <meta name="robots" content="index, follow">

    <link rel="canonical"
          href="https://blessia777.github.io/FamousFace/quiz.html">

    <!-- Open Graph / Facebook -->
    <meta property="og:title"
          content="FamousFace - Famous People Quiz">

    <meta property="og:description"
          content="Test your knowledge of famous people with fun quizzes covering music, movies, sports, history and more.">

    <meta property="og:type" content="website">

    <meta property="og:url"
          content="https://blessia777.github.io/FamousFace/quiz.html">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary">

    <meta name="twitter:title"
          content="FamousFace - Famous People Quiz">

    <meta name="twitter:description"
          content="Challenge yourself with FamousFace quizzes about famous people, celebrities, music, movies, sports and history.">

    <link rel="stylesheet" href="style.css">
</head>


<body>

<header>
    <h1>🌟 FamousFace</h1>
    <p>🎯 Famous People Quiz</p>
</header>

<main class="quiz">

    <!-- Player Registration -->
    <section id="playerRegistration">
        <h2>👋 Welcome to FamousFace!</h2>

        <p>Enter your name to start the quiz.</p>

        <input
            type="text"
            id="playerName"
            placeholder="Enter your name"
            maxlength="30"
            autocomplete="name"
        >

        <button id="startButton">
            🎮 Start Quiz
        </button>

        <p id="nameError"></p>
    </section>

    <!-- Quiz Area -->
    <section id="quizArea" style="display:none;">

        <p id="playerWelcome"></p>

        <h2 id="question">Question goes here</h2>

        <div id="answers"></div>

        <button id="nextButton">
            Next Question
        </button>

        <div id="result"></div>

    </section>

</main>

<footer>
    <p>© 2026 FamousFace</p>
</footer>

<script src="supabase-config.js"></script>
<script src="script.js"></script>

</body>
</html>
