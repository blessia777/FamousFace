
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FamousFace - Mystery Song</title>

    <meta name="description"
          content="Play FamousFace Mystery Song and identify famous songs from clues.">

    <link rel="stylesheet" href="style.css">

    <style>

        .mystery-song-page {
            max-width: 900px;
            margin: 0 auto;
            padding: 50px 20px;
        }

        .mystery-song-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .mystery-song-header h1 {
            font-size: 3rem;
            margin: 10px 0;
        }

        .mystery-song-card {
            max-width: 700px;
            margin: auto;
            padding: 40px;
            border-radius: 25px;
            background: white;
            box-shadow: 0 15px 45px rgba(0,0,0,0.12);
            text-align: center;
        }

        .mystery-icon {
            font-size: 4rem;
            margin: 20px 0;
        }

        #round-label {
            font-weight: bold;
            opacity: 0.7;
        }

        .mystery-score {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin: 20px 0;
            font-weight: bold;
        }

        .score-box {
            padding: 10px 18px;
            border-radius: 12px;
            background: #f3f6fa;
        }

        #clues {
            margin: 25px 0;
        }

        .mystery-clue {
            padding: 15px;
            margin: 12px 0;
            border-radius: 14px;
            background: #f4f7fb;
            text-align: left;
            animation: clueAppear 0.3s ease;
        }

        @keyframes clueAppear {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #reveal-button {
            margin: 10px 0 25px;
        }

        #answers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 20px;
        }

        .mystery-answer {
            padding: 16px;
            border: 2px solid #ddd;
            border-radius: 14px;
            background: white;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .mystery-answer:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }

        .mystery-answer:disabled {
            cursor: default;
            opacity: 0.8;
        }

        .correct-answer {
            font-weight: bold;
            border: 2px solid #22a447;
        }

        .wrong-answer {
            border: 2px solid #d93025;
        }

        #feedback {
            min-height: 35px;
            margin: 25px 0;
            font-weight: bold;
        }

        .points-earned {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .streak-display {
            font-size: 1.1rem;
        }

        @media (max-width: 600px) {

            .mystery-song-page {
                padding: 35px 15px;
            }

            .mystery-song-header h1 {
                font-size: 2.2rem;
            }

            .mystery-song-card {
                padding: 25px 18px;
            }

            #answers {
                grid-template-columns: 1fr;
            }

            .mystery-score {
                flex-direction: column;
                gap: 8px;
            }

        }

    </style>

</head>

<body>

    <div class="logo">
        <img src="famousface-logo.png" alt="FamousFace Quiz">
    </div>

    <nav class="nav-links">

        <a href="index.html">Home</a>

        <a href="music-quiz.html">Music Quiz</a>

        <a href="index.html#categories">Quizzes</a>

    </nav>

    <main class="mystery-song-page">

        <section class="mystery-song-header">

            <p class="section-label">
                🎵 FAMOUSFACE MUSIC CHALLENGE
            </p>

            <h1>🎧 Mystery Song</h1>

            <p>
                Reveal the clues and identify the famous song.
            </p>

        </section>


        <section class="mystery-song-card">

            <div id="round-label">
                Round 1
            </div>


            <div class="mystery-score">

                <div class="score-box">
                    🏆 Score:
                    <span id="score">0</span>
                </div>

                <div class="score-box">
                    🔥 Streak:
                    <span id="streak">0</span>
                </div>

            </div>


            <div class="mystery-icon">
                🎵
            </div>


            <h2 id="question">
                Loading mystery song...
            </h2>


            <div id="clues"></div>


            <button
                id="reveal-button"
                class="primary-button"
                type="button">

                💡 Reveal Clue

            </button>


            <div id="answers"></div>


            <p id="feedback"></p>


            <button
                id="next-button"
                class="primary-button"
                type="button"
                style="display:none;">

                Next Song →

            </button>

        </section>

    </main>


    <footer>

        <p>
            © 2026 FamousFace. All rights reserved.
        </p>

        <p>

            <a href="about.html">About</a> |

            <a href="contact.html">Contact</a> |

            <a href="privacy.html">Privacy Policy</a>

        </p>

    </footer>


<script>


/* ==========================================
   MYSTERY SONG QUESTIONS
========================================== */

const mysterySongs = [

    {
        question:
            "Which famous song is strongly associated with Michael Jackson?",

        clues: [
            "👑 The artist was known as the King of Pop.",
            "🎤 The artist became one of the world's most famous entertainers.",
            "🕺 The song is one of his best-known hits."
        ],

        answers: [
            "Thriller",
            "Hello",
            "Shape of You",
            "Havana"
        ],

        correct: "Thriller"
    },


    {
        question:
            "Which song became a major worldwide hit for Adele?",

        clues: [
            "🇬🇧 The artist is a British singer.",
            "🎤 She is known for her powerful vocals.",
            "❤️ The song became an international hit."
        ],

        answers: [
            "Hello",
            "Thriller",
            "Havana",
            "Uptown Funk"
        ],

        correct: "Hello"
    },


    {
        question:
            "Which song is associated with a globally famous English singer-songwriter?",

        clues: [
            "🎤 The artist is known for international pop hits.",
            "🌍 The artist has performed around the world.",
            "🎵 The song became one of the artist's well-known hits."
        ],

        answers: [
            "Shape of You",
            "Thriller",
            "Hello",
            "Billie Jean"
        ],

        correct: "Shape of You"
    }

];


/* ==========================================
   GAME VARIABLES
========================================== */

let currentRound = 0;
let score = 0;
let streak = 0;
let currentClue = 0;
let roundFinished = false;
    /* ==========================================
   DAILY PROGRESS
========================================== */

const todayKey = new Date().toISOString().split("T")[0];

const savedDailyData =
    JSON.parse(localStorage.getItem("famousFaceDailySong")) || {
        lastPlayed: null,
        streak: 0,
        completed: false,
        score: 0
    };

let dailyStreak = savedDailyData.streak;


/* ==========================================
   SAVE DAILY RESULT
========================================== */

function saveDailyResult() {

    const previousDate =
        savedDailyData.lastPlayed;

    let newStreak =
        dailyStreak;


    if (previousDate === todayKey) {

        // Already completed today.
        newStreak = dailyStreak;

    } else if (previousDate) {

        const previous =
            new Date(previousDate);

        const today =
            new Date(todayKey);

        const difference =
            Math.round(
                (today - previous) /
                (1000 * 60 * 60 * 24)
            );


        if (difference === 1) {

            newStreak++;

        } else {

            newStreak = 1;

        }

    } else {

        newStreak = 1;

    }


    dailyStreak = newStreak;


    const dailyData = {

        lastPlayed: todayKey,

        streak: dailyStreak,

        completed: true,

        score: score

    };


    localStorage.setItem(
        "famousFaceDailySong",
        JSON.stringify(dailyData)
    );

}

/* ==========================================
   DAILY MYSTERY SONG
========================================== */

function getDailySongIndex() {

    const today = new Date();

    const year = today.getFullYear();
    const month = today.getMonth();
    const day = today.getDate();

    /*
       Create a number from today's date.
       This means everyone gets the same
       song on the same day.
    */

    const dateNumber =
        year * 10000 +
        (month + 1) * 100 +
        day;

    return dateNumber % mysterySongs.length;
}

const dailySongIndex =
    getDailySongIndex();

const dailySong =
    mysterySongs[dailySongIndex];

/* ==========================================
   PAGE ELEMENTS
========================================== */

const questionElement =
    document.getElementById("question");

const cluesElement =
    document.getElementById("clues");

const answersElement =
    document.getElementById("answers");

const feedbackElement =
    document.getElementById("feedback");

const nextButton =
    document.getElementById("next-button");

const revealButton =
    document.getElementById("reveal-button");

const roundLabel =
    document.getElementById("round-label");

const scoreElement =
    document.getElementById("score");

const streakElement =
    document.getElementById("streak");


/* ==========================================
   LOAD ROUND
========================================== */

function loadRound() {

   const song = dailySong;


    currentClue = 0;

    roundFinished = false;

roundLabel.textContent =
    "📅 Today's Mystery Song";
 

    questionElement.textContent =
        song.question;


    cluesElement.innerHTML = "";


    answersElement.innerHTML = "";


    feedbackElement.textContent = "";


    nextButton.style.display =
        "none";


    revealButton.style.display =
        "inline-block";


    revealButton.disabled =
        false;


    revealButton.textContent =
        "💡 Reveal Clue";


    /* Create answer buttons */

    song.answers.forEach(answer => {

        const button =
            document.createElement("button");


        button.className =
            "mystery-answer";


        button.textContent =
            answer;


        button.addEventListener(
            "click",
            () => checkAnswer(answer)
        );


        answersElement.appendChild(button);

    });


    updateScoreDisplay();

}


/* ==========================================
   REVEAL CLUE
========================================== */

revealButton.addEventListener(
    "click",
    revealNextClue
);


function revealNextClue() {

    const song =
        mysterySongs[currentRound];


    if (currentClue >= song.clues.length) {

        revealButton.disabled =
            true;

        return;

    }


    const clueElement =
        document.createElement("p");


    clueElement.className =
        "mystery-clue";


    clueElement.textContent =
        `${currentClue + 1}. ${song.clues[currentClue]}`;


    cluesElement.appendChild(clueElement);


    currentClue++;


    if (currentClue === song.clues.length) {

        revealButton.textContent =
            "🔓 All Clues Revealed";

        revealButton.disabled =
            true;

    }

}


/* ==========================================
   CHECK ANSWER
========================================== */

function checkAnswer(answer) {

    if (roundFinished) {
        return;
    }


    const song =
        mysterySongs[currentRound];


    roundFinished = true;


    const buttons =
        document.querySelectorAll(
            ".mystery-answer"
        );


    buttons.forEach(button => {

        button.disabled = true;


        if (
            button.textContent ===
            song.correct
        ) {

            button.classList.add(
                "correct-answer"
            );

        }


        if (
            button.textContent === answer &&
            answer !== song.correct
        ) {

            button.classList.add(
                "wrong-answer"
            );

        }

    });


    if (answer === song.correct) {

        let points = 50;


        if (currentClue === 1) {

            points = 100;

        } else if (currentClue === 2) {

            points = 75;

        } else {

            points = 50;

        }


        score += points;


        streak++;


        feedbackElement.innerHTML =

            `🎉 Correct! ` +
            `<span class="points-earned">+${points} points</span>`;


    } else {

        streak = 0;


        feedbackElement.textContent =
            `❌ Not quite! The correct answer was "${song.correct}".`;

    }


    updateScoreDisplay();


    revealButton.style.display =
        "none";


    nextButton.style.display =
        "inline-block";

}


/* ==========================================
   SCORE DISPLAY
========================================== */

function updateScoreDisplay() {

    scoreElement.textContent =
        score;


    streakElement.textContent =
        streak;

}


/* ==========================================
   NEXT ROUND
========================================== */

nextButton.addEventListener(
    "click",
    () => {

        showFinalResult();

    }
);
    //SAVE SCORE TO SUPABASE
async function saveDailyMysteryScore() {

    try {

        /*
         * We use the same Supabase configuration
         * already used by FamousFace.
         */

        const playerName =
            localStorage.getItem("famousFacePlayerName") ||
            "Anonymous";


        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/scores`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`,
                    "Prefer": "return=minimal"
                },

                body: JSON.stringify({

                    player_name: playerName,

                    category: "mystery_song",

                    score: score,

                    total_questions: 1,

                    /*
                     * Maximum score is 100.
                     */

                    percentage: score,

                    daily_challenge: true

                })
            }
        );


        if (!response.ok) {

            const errorText =
                await response.text();

            console.error(
                "Daily Mystery Song Supabase error:",
                errorText
            );

            return;

        }


        console.log(
            "Daily Mystery Song score saved!"
        );


    } catch (error) {

        console.error(
            "Could not save Daily Mystery Song score:",
            error
        );

    }

}
```


/* ==========================================
   FINAL RESULT
========================================== */


function showFinalResult() {
saveDailyResult();
saveDailyMysteryScore();
    roundLabel.textContent =
        "📅 Daily Mystery Song Complete";
    const streakMessage =
    `🔥 Your Daily Streak: ${dailyStreak} day${dailyStreak === 1 ? "" : "s"}`;


    questionElement.textContent =
        `You scored ${score} points today!`;


    cluesElement.innerHTML = "";


    answersElement.innerHTML = "";


    revealButton.style.display =
        "none";


    nextButton.style.display =
        "inline-block";


    nextButton.textContent =
        "🔄 Play Today's Challenge Again";


    if (score >= 100) {

        feedbackElement.innerHTML =
            "🏆 AMAZING! You solved today's Mystery Song using the first clue!";

    } else if (score >= 75) {

        feedbackElement.innerHTML =
            "🔥 Great job! You solved today's Mystery Song!";

    } else {

        feedbackElement.innerHTML =
            "🎵 Good try! Come back tomorrow for a new Mystery Song!";

    }

}

/* ==========================================
   START GAME
========================================== */

loadRound();
<script src="supabase-config.js"></script>

</script>

</body>

</html>
